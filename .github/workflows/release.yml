name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each skill
        run: |
          mkdir dist
          for dir in plugins/*/skills/*/; do
            name=$(basename "$dir")
            (cd "$(dirname "$dir")" && zip -qr "$GITHUB_WORKSPACE/dist/skillsdugout-$name.zip" "$name")
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
